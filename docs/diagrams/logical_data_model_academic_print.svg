<text x="1072" y="930" text-anchor="start" font-size="19" fill="#1A1B22" direction="rtl">الهوية وملف المستخدم — معرّف المستند هو معرّف حساب المصادقة</text>
<text x="1100" y="957" text-anchor="start" font-size="19" fill="#1A1B22" direction="rtl">الحقول الكاملة لكل مجموعة مذكورة في جدول (4-3). حقول التدقيق createdBy وassignedBy وuploadedBy تشير كلها إلى users.</text>
<text x="581" y="1032" text-anchor="middle" font-size="16" fill="#4A5164" direction="rtl">العلاقات المعروضة روابط منطقية بين مستندات Firestore عبر حقول المعرّفات، وليست قيود مفاتيح أجنبية (Foreign Key) في قاعدة بيانات علائقية.</text>
